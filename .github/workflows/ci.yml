name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install (exact versions from uv.lock)
        run: uv sync --locked --extra dev
      - name: Test
        run: uv run pytest
      - name: Smoke test on the runner itself
        run: |
          uv run loot --help
          uv run loot paths
          uv run loot scan --json > /dev/null || true
        shell: bash
