[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loot"
version = "0.1.0"
description = "See what an infostealer would take from your laptop, then empty the list. Read-only, nothing leaves your machine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["security", "infostealer", "credentials", "secrets", "hardening", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = ["click>=8.1", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://redakarrach.github.io/loot/"
Repository = "https://github.com/RedaKarrach/loot"

[project.scripts]
loot = "loot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
