<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="loot">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="230" rx="36" fill="#0b0b0d"/>

  <!-- mark: a stealer's sack with a stolen key -->
  <g transform="translate(34,22) scale(0.72)" filter="url(#glow)">
    <path d="M78 122 C58 146 56 184 74 206 C92 228 164 228 182 206 C200 184 198 146 178 122 Z" fill="#1a1013" stroke="#ff4d6d" stroke-width="8" stroke-linejoin="round"/>
    <path d="M100 122 C96 108 104 98 116 94 H140 C152 98 160 108 156 122" fill="#1a1013" stroke="#ff4d6d" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M94 123 H162" stroke="#ff4d6d" stroke-width="8" stroke-linecap="round"/>
    <g stroke="#ff4d6d" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="170" cy="52" r="17" fill="#0b0b0d" stroke-width="8"/>
      <path d="M158 64 L122 100" stroke-width="10" fill="none"/>
      <path d="M136 86 L146 96 M128 94 L136 102" stroke-width="8" fill="none"/>
    </g>
    <path d="M104 100 L84 86 L96 74 L116 88" fill="#1a1013" stroke="#ff4d6d" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <text x="250" y="140" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="700" font-size="112" fill="#ff4d6d" filter="url(#glow)">loot</text>
  <text x="254" y="182" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="19" fill="#7c7873" letter-spacing="2.5">WHAT AN INFOSTEALER WOULD TAKE FROM YOUR LAPTOP</text>

  <!-- motif: a trail of loot -->
  <path d="M250 206 H952" fill="none" stroke="#5a2130" stroke-width="6" stroke-linecap="round"/>
  <g fill="#ff4d6d" filter="url(#glow)">
    <circle cx="250" cy="206" r="7"/>
    <circle cx="430" cy="206" r="7"/>
    <circle cx="610" cy="206" r="7"/>
    <circle cx="790" cy="206" r="7"/>
    <circle cx="952" cy="206" r="7"/>
  </g>
</svg>
